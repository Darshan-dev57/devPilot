# Render blueprint for DevPilot backend (free tier, no card required).
# No-login architecture: server GitHub token + visitor AI key via header.
# Frontend goes on Vercel, database on Neon — see docs/DEPLOY-FREE.md.
services:
  - type: web
    name: devpilot-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SERVER_PORT
        value: 10000
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx320m -XX:MaxMetaspaceSize=160m"
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATASOURCE_HIKARI_MAX_LIFETIME
        value: 300000
      - key: SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME
        value: 60000
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      # Server-side GitHub token for fetching repo data (no user accounts).
      # Create one free at github.com/settings/tokens (classic, repo scope).
      - key: APP_GITHUB_TOKEN
        value: paste-your-github-token-here
        sync: false

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5433/devpilot
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

app.frontend-url=http://localhost:3000
app.cors.allowed-origins=http://localhost:3000

# No server-side AI key: visitors bring their own via the X-Api-Key header and
# AiModelFactory builds chat/embedding models per request. Spring AI's OpenAI
# auto-configuration is excluded in BackendApplication for this reason.

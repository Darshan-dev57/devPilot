server.port=${PORT:8080}

# Local default matches docker-compose.yml (Postgres + pgvector on port 5433).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/devpilot}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Optional. Without a token GitHub allows 60 API calls an hour per server IP, which is
# enough for about 15-20 index runs (each run costs 2-4 calls). A token with no scopes
# raises that to 5,000. Never commit a real token; set GITHUB_TOKEN in the environment.
app.github.token=${GITHUB_TOKEN:}

# One AI key for the whole server, set by the owner. Visitors never paste a key.
# Default: Gemini free tier. Get a key at https://aistudio.google.com/apikey
# AI_PROVIDER picks gemini, openai, ollama or opencode; empty means "whichever key is set".
# opencode = answers from an OpenCode Zen model, embeddings from AI_EMBEDDING_PROVIDER
# (default gemini, since OpenCode Zen has no embeddings endpoint).
app.ai.provider=${AI_PROVIDER:}
app.ai.embedding-provider=${AI_EMBEDDING_PROVIDER:}
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
app.ai.gemini.key-header=${GEMINI_KEY_HEADER:x-goog-api-key}
app.ai.gemini.chat-model=${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}
app.ai.gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}
app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
app.ai.openai.chat-model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
app.ai.opencode.api-key=${OPENCODE_API_KEY:}
app.ai.opencode.base-url=${OPENCODE_BASE_URL:https://opencode.ai/zen/v1}
app.ai.opencode.chat-model=${OPENCODE_MODEL:longcat-2.5-preview-free}
app.ai.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
app.ai.ollama.chat-model=${OLLAMA_CHAT_MODEL:qwen2.5-coder:1.5b}
app.ai.ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

# Free-quota protection. 0 switches a limit off. Days roll over at midnight Pacific,
# when Google resets the Gemini free tier's daily quota.
app.limits.questions-per-visitor=${LIMIT_QUESTIONS_PER_VISITOR:30}
app.limits.indexes-per-visitor=${LIMIT_INDEXES_PER_VISITOR:5}
app.limits.questions-global=${LIMIT_QUESTIONS_GLOBAL:1000}
app.limits.indexes-global=${LIMIT_INDEXES_GLOBAL:100}
app.limits.max-repo-mb=${MAX_REPO_MB:60}
app.limits.max-files=${MAX_INDEX_FILES:800}
app.indexing.chunk-size=1500
app.indexing.max-file-bytes=102400

management.endpoints.web.exposure.include=health

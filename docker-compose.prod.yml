services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devpilot-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devpilot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - devpilot_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-devpilot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: devpilot-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-devpilot}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?set GITHUB_CLIENT_ID in .env}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?set GITHUB_CLIENT_SECRET in .env}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_SCOPE: read:user,repo
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_FRONTEND_URL: https://${DOMAIN:?set DOMAIN in .env}
      APP_CORS_ALLOWED_ORIGINS: https://${DOMAIN:?set DOMAIN in .env}
      APP_TOKEN_ENCRYPTOR_PASSWORD: ${TOKEN_ENCRYPTOR_PASSWORD:?set TOKEN_ENCRYPTOR_PASSWORD in .env}
      APP_TOKEN_ENCRYPTOR_SALT: ${TOKEN_ENCRYPTOR_SALT:?set TOKEN_ENCRYPTOR_SALT in .env}
      # Placeholder on purpose: every user brings their own OpenAI key in Settings.
      SPRING_AI_OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-byok-mode-placeholder}
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      args:
        # Empty = same-origin API calls through Caddy. No per-env rebuild needed.
        NEXT_PUBLIC_API_BASE_URL: ""
    container_name: devpilot-frontend
    depends_on:
      - backend
    expose:
      - "3000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: devpilot-caddy
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - devpilot_caddy_data:/data
      - devpilot_caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    restart: unless-stopped

volumes:
  devpilot_pg_data:
  devpilot_caddy_data:
  devpilot_caddy_config:

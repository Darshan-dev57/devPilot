services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devpilot-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devpilot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - devpilot_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-devpilot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: devpilot-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-devpilot}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_FRONTEND_URL: https://${DOMAIN:?set DOMAIN in .env}
      APP_CORS_ALLOWED_ORIGINS: https://${DOMAIN:?set DOMAIN in .env}
      APP_GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # One AI key for the whole site. Visitors never paste one.
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env (free at aistudio.google.com/apikey)}
      LIMIT_QUESTIONS_PER_VISITOR: ${LIMIT_QUESTIONS_PER_VISITOR:-30}
      LIMIT_INDEXES_PER_VISITOR: ${LIMIT_INDEXES_PER_VISITOR:-5}
      AI_PROVIDER: ${AI_PROVIDER:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-longcat-2.5-preview-free}
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      args:
        # Empty = same-origin API calls through Caddy. No per-env rebuild needed.
        NEXT_PUBLIC_API_BASE_URL: ""
    container_name: devpilot-frontend
    depends_on:
      - backend
    expose:
      - "3000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: devpilot-caddy
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - devpilot_caddy_data:/data
      - devpilot_caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    restart: unless-stopped

volumes:
  devpilot_pg_data:
  devpilot_caddy_data:
  devpilot_caddy_config:
